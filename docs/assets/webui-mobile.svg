<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-label="StackChan Local mobile WebUI example">
  <defs>
    <style>
      .title{font:700 22px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#eef4f5}
      .label{font:600 12px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#a8b7bd}
      .value{font:700 16px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#eef4f5}
      .small{font:500 11px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#91a2a9}
      .panel{fill:#172024;stroke:#2a373d;stroke-width:1}
    </style>
  </defs>
  <rect width="390" height="844" fill="#0b1014"/>
  <rect x="0" y="0" width="390" height="76" fill="#11191d"/>
  <text x="18" y="30" class="title">StackChan Local</text>
  <text x="18" y="54" class="small">Online  Face 4fps  Battery 82%  Wi-Fi -61</text>

  <g transform="translate(14 92)">
    <rect class="panel" x="0" y="0" width="362" height="280" rx="10"/>
    <rect x="14" y="14" width="334" height="252" rx="8" fill="#202b31"/>
    <circle cx="181" cy="138" r="72" fill="#364a52"/>
    <circle cx="158" cy="126" r="9" fill="#101719"/>
    <circle cx="204" cy="126" r="9" fill="#101719"/>
    <path d="M158 168 Q181 188 204 168" fill="none" stroke="#101719" stroke-width="7" stroke-linecap="round"/>
    <rect x="110" y="58" width="142" height="160" rx="4" fill="none" stroke="#43d5b0" stroke-width="3"/>
    <line x1="181" y1="120" x2="181" y2="156" stroke="#e3b341" stroke-width="2"/>
    <line x1="163" y1="138" x2="199" y2="138" stroke="#e3b341" stroke-width="2"/>
    <text x="18" y="250" class="small">confidence 0.82  latency 43ms</text>
  </g>

  <g transform="translate(14 386)">
    <rect x="0" y="0" width="362" height="42" rx="8" fill="#11181c"/>
    <rect x="4" y="4" width="86" height="34" rx="7" fill="#24343a"/>
    <text x="18" y="26" class="small" fill="#eef4f5">Overview</text>
    <text x="105" y="26" class="small">Hardware</text>
    <text x="195" y="26" class="small">Tuning</text>
    <text x="278" y="26" class="small">Logs</text>
  </g>

  <g transform="translate(14 446)">
    <rect class="panel" x="0" y="0" width="362" height="112" rx="10"/>
    <text x="16" y="30" class="value">Power &amp; IO</text>
    <text x="16" y="58" class="label">Battery</text>
    <text x="282" y="58" class="small">82%</text>
    <text x="16" y="82" class="label">Backlight</text>
    <text x="282" y="82" class="small">70%</text>
  </g>

  <g transform="translate(14 572)">
    <rect class="panel" x="0" y="0" width="362" height="128" rx="10"/>
    <text x="16" y="30" class="value">Motion</text>
    <rect x="18" y="46" width="92" height="62" rx="8" fill="#11181c"/>
    <path d="M38 84 L76 60 L98 78 L60 104 Z" fill="#26383e" stroke="#6cb6ff"/>
    <text x="130" y="66" class="label">IMU</text>
    <text x="130" y="90" class="small">roll -2.1  pitch 4.8</text>
    <text x="130" y="112" class="small">yaw 13.0  filter kalman</text>
  </g>

  <g transform="translate(14 714)">
    <rect class="panel" x="0" y="0" width="362" height="96" rx="10"/>
    <text x="16" y="30" class="value">Logs</text>
    <text x="16" y="58" class="small">13:20 command trackFace ack 42ms</text>
    <text x="16" y="80" class="small">13:20 sensorSnapshot battery 82%</text>
  </g>
</svg>
